spring:
  application:
    name: lagerkern
  datasource:
    url: jdbc:postgresql://localhost:5432/lagerkern
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration